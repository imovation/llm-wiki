name: auto-update-check

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run update check
        id: check
        run: |
          python3 scripts/check_updates.py --dry-run > /tmp/check.out 2>&1 || true
          echo "dry_run_output:"
          cat /tmp/check.out
          if grep -qE '\[check\].*->' /tmp/check.out; then
            echo "has_updates=yes" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Open issue if updates pending
        if: steps.check.outputs.has_updates == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            if (!issues.some(i => i.title.includes('pending tool updates'))) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'pending tool updates',
                body: '脚本检测到工具更新但 raw/releases 未同步。请检查本地 cron / auto_ingest.sh。'
              });
            }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml
      - name: Run lint
        id: lint
        shell: bash
        run: |
          OUTPUT="$(python3 scripts/lint.py 2>&1)"
          rc=$?
          echo "lint_output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "lint_rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Open issue if lint fails
        if: steps.lint.outputs.lint_rc != '0'
        uses: actions/github-script@v7
        env:
          LINT_OUTPUT: ${{ steps.lint.outputs.lint_output }}
        with:
          script: |
            const out = process.env.LINT_OUTPUT;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            if (!issues.some(i => i.title.includes('lint: knowledge base issues'))) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'lint: knowledge base issues',
                body: '每日 lint 发现知识库问题：\n\n```\n' + out + '\n```\n\n修复后合入即可，无需手动关闭本 issue（下次运行通过后不会重开）。'
              });
            }